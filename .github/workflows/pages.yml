name: Publish GitHub Pages

on:
  push:
    branches: [codex/anchor0-site]
    paths:
      - 'dist/**'
      - 'scripts/prepare-pages.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Package tracked website files
        run: python3 scripts/prepare-pages.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .cache/github-pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
